('ResizeObserver'in window)new ResizeObserver(queue).observe(document.documentElement);document.addEventListener('click',e=>{if(!e.target.closest('.wrap_btn_zoom button')){e.preventDefault();e.stopImmediatePropagation();}},true);window.addEventListener('load',queue);})();</script></head><body><!--
